[main]
font=JetBrainsMono Nerd Font:size=12
terminal=kitty
prompt="> "
layer=overlay
width=60        # Erhöht die Breite (Standard ist oft geringer, z.B. 30-40)
lines=15        # Anzahl der angezeigten App-Zeilen

