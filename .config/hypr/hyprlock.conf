# ~/.config/hypr/hyprlock.conf

# --- HINTERGRUND ---
background {
    monitor =
    # Hiermit wird ein Bild deines aktuellen Bildschirms beim Sperren gemacht
    path = screenshot
    # Fallback-Farbe, falls der Screenshot fehlschlägt
    color = rgba(25, 20, 20, 1.0)
    # Blur-Effekt (ähnlich wie in MacOS/iOS)
    blur_passes = 2
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- PASSWORT-EINGABEFELD ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33 # Skalierung der Punkte
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(15, 15, 15)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Passwort eingeben...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
    # Verbirgt die Punkte und zeigt stattdessen nur einen reagierenden Ring
    hide_input = true
}

# --- UHRZEIT ---
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 75
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 200
    halign = center
    valign = center
}

# --- DATUM ---
label {
    monitor =
    # Führt den date-Befehl aus und aktualisiert ihn (hier jede Minute = 60000ms)
    text = cmd[update:60000] echo "$(date +'%A, %d. %B %Y')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = JetBrains Mono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
